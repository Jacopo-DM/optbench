[project]
name = "optbench"
version = "0.1.0"
description = "Test functions for optimisation algorithms, from the SFU Virtual Library of Simulation Experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jmdm", email = "jacopo.michele.dimatteo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
